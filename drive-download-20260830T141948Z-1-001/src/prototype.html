<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sangspil – fase 1 prototype</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
    line-height: 1.5;
  }
  button {
    padding: 8px 12px;
    margin: 4px 4px 4px 0;
  }
  input[type="text"] {
    padding: 8px;
    font-size: 1em;
    width: 100%;
    box-sizing: border-box;
  }
  #game {
    border-top: 1px solid #ccc;
    padding-top: 16px;
    margin-top: 16px;
  }
  .fejl { color: #a00; }
  #forslag-liste {
    margin: 6px 0 4px;
  }
  #forslag-liste button {
    display: block;
    width: 100%;
    text-align: left;
    box-sizing: border-box;
    margin: 2px 0;
  }
  #forslag-liste .ingen-match {
    opacity: 0.6;
    margin: 4px 0;
  }
</style>
</head>
<body>

<h1>Sangspil — grim prototype (fase 1)</h1>
<p>Ingen design, intet navn, ingen deling. Spørgsmålet er kun: er det sjovt?</p>

<div id="game">Indlæser…</div>

<audio id="afspiller" style="display:none"></audio>

<script>
  // ---- Data: fem sange fra data/sange.csv (indbygget direkte, sange.json er tom indtil fase 2) ----
  const SANGE = [
    { titel: "Barbie Girl", kunstner: "Aqua" },
    { titel: "Kun for mig", kunstner: "Medina" },
    { titel: "Sleeping My Day Away", kunstner: "D-A-D" },
    { titel: "Bag duggede ruder", kunstner: "TV-2" },
    { titel: "Costa Kalundborg", kunstner: "Shu-bi-dua" },
  ];

  // Klip-trin i sekunder. Klippet starter fra begyndelsen af Apples preview-klip,
  // IKKE fra sangens rigtige start — det er præcis det denne prototype skal afsløre.
  const KLIP_TRIN = [0.1, 0.5, 2, 8, 15];

  const state = {
    sangIndex: 0,
    trinIndex: 0,
    rigtige: 0,
    nuvaerendeSang: null,
    afsloeret: false,
  };

  let spilTimeout = null;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function normaliser(s) {
    return String(s)
      .toLowerCase()
      .normalize("NFC")
      .replace(/[^\p{L}\p{N}\s]/gu, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  // ---- Opslag mod Apples iTunes Search API ----
  // Apples egen dokumentation siger at browser-baserede opslag (cross-site)
  // SKAL bruge JSONP med "callback"-parameteren og et dynamisk <script>-tag —
  // almindeligt fetch()/XHR bliver blokeret af CORS, fordi endpointet ikke
  // sender Access-Control-Allow-Origin. Det var derfor ingen sange virkede.
  let jsonpTaeller = 0;
  function jsonpHentning(url) {
    return new Promise((resolve, reject) => {
      const callbackNavn = `itunesCallback${jsonpTaeller++}`;
      const script = document.createElement("script");
      let timeoutId;

      function ryddOp() {
        delete window[callbackNavn];
        script.remove();
        clearTimeout(timeoutId);
      }

      window[callbackNavn] = data => {
        ryddOp();
        resolve(data);
      };
      script.onerror = () => {
        ryddOp();
        reject(new Error("JSONP-script kunne ikke indlæses"));
      };
      timeoutId = setTimeout(() => {
        ryddOp();
        reject(new Error("JSONP-opslag fik ikke svar (timeout)"));
      }, 10000);

      script.src = `${url}&callback=${callbackNavn}`;
      document.body.appendChild(script);
    });
  }

  async function slaaSangOp(sang) {
    const term = encodeURIComponent(`${sang.titel} ${sang.kunstner}`);
    const url = `https://itunes.apple.com/search?term=${term}&country=DK&media=music&entity=song&limit=1`;
    try {
      const data = await jsonpHentning(url);
      if (data.resultCount > 0 && data.results[0].previewUrl) {
        const r = data.results[0];
        return {
          ...sang,
          fundet: true,
          previewUrl: r.previewUrl,
          link: r.trackViewUrl,
        };
      }
      return { ...sang, fundet: false };
    } catch (e) {
      console.error("iTunes-opslag fejlede for", sang.titel, e);
      return { ...sang, fundet: false, fejl: true };
    }
  }

  // ---- Spilforløb ----
  async function startSang() {
    state.trinIndex = 0;
    state.afsloeret = false;
    state.nuvaerendeSang = null;
    renderIndlaeser();

    const sang = SANGE[state.sangIndex];
    const fundetSang = await slaaSangOp(sang);
    state.nuvaerendeSang = fundetSang;

    const audio = document.getElementById("afspiller");
    if (fundetSang.fundet) {
      audio.src = fundetSang.previewUrl;
    } else {
      audio.removeAttribute("src");
    }
    render();
  }

  function spilKlip() {
    const audio = document.getElementById("afspiller");
    const varighed = KLIP_TRIN[state.trinIndex];
    clearTimeout(spilTimeout);
    audio.currentTime = 0;
    audio.play().catch(e => console.error("Kunne ikke afspille", e));
    spilTimeout = setTimeout(() => audio.pause(), varighed * 1000);
  }

  function gaetIndsendt(vaerdi) {
    if (state.afsloeret) return;
    const gaet = normaliser(vaerdi);
    if (gaet.length === 0) return;
    const rigtigTitel = normaliser(state.nuvaerendeSang.titel);
    if (gaet === rigtigTitel) {
      state.rigtige++;
      afsloerSang("rigtigt");
    } else {
      naesteTrin("forkert");
    }
  }

  function springOver() {
    if (state.afsloeret) return;
    naesteTrin("sprunget-over");
  }

  function naesteTrin(besked) {
    const audio = document.getElementById("afspiller");
    audio.pause();
    if (state.trinIndex < KLIP_TRIN.length - 1) {
      state.trinIndex++;
      render(besked);
    } else {
      afsloerSang("ikke-gaettet");
    }
  }

  function afsloerSang(besked) {
    const audio = document.getElementById("afspiller");
    audio.pause();
    state.afsloeret = true;
    render(besked);
  }

  function naesteSang() {
    state.sangIndex++;
    if (state.sangIndex >= SANGE.length) {
      renderSlut();
    } else {
      startSang();
    }
  }

  function nulstil() {
    state.sangIndex = 0;
    state.rigtige = 0;
    startSang();
  }

  // ---- Rendering ----
  function renderIndlaeser() {
    document.getElementById("game").innerHTML = `<p>Slår sang op hos Apple Music…</p>`;
  }

  function render(besked) {
    const sang = state.nuvaerendeSang;
    const el = document.getElementById("game");
    if (!sang) return;

    if (!sang.fundet) {
      el.innerHTML = `
        <p>Sang ${state.sangIndex + 1} af ${SANGE.length}</p>
        <p class="fejl">Fandt ikke <strong>${escapeHtml(sang.titel)} – ${escapeHtml(sang.kunstner)}</strong> hos Apple Music${sang.fejl ? " (opslaget fejlede — se konsollen)" : ""}.</p>
        <button onclick="naesteSang()">Næste sang</button>
      `;
      return;
    }

    const varighed = KLIP_TRIN[state.trinIndex];
    let html = `
      <p>Sang ${state.sangIndex + 1} af ${SANGE.length} — point: ${state.rigtige}</p>
      <p>Klip ${state.trinIndex + 1} af ${KLIP_TRIN.length}: ${varighed} sekund${varighed === 1 ? "" : "er"}</p>
      <button onclick="spilKlip()">▶ Afspil klip</button>
    `;

    if (besked === "forkert") html += `<p>Forkert. Næste klip er længere.</p>`;
    if (besked === "sprunget-over") html += `<p>Sprunget over. Næste klip er længere.</p>`;

    if (!state.afsloeret) {
      html += `
        <div>
          <input id="gaet-input" type="text" placeholder="Skriv en sangtitel…" autocomplete="off"
                 oninput="opdaterForslag(this.value)" onkeydown="haandterTast(event)">
          <div id="forslag-liste"></div>
          <button onclick="springOver()">Spring over</button>
        </div>
      `;
    } else {
      const overskrift = besked === "rigtigt" ? "Rigtigt!" : "Ikke gættet.";
      html += `
        <p><strong>${overskrift}</strong> Det var "${escapeHtml(sang.titel)}" med ${escapeHtml(sang.kunstner)}.</p>
        <p><a href="${sang.link}" target="_blank" rel="noopener">Hør hele sangen på Apple Music</a></p>
        <button onclick="naesteSang()">Næste sang</button>
      `;
    }

    el.innerHTML = html;
    const input = document.getElementById("gaet-input");
    if (input) {
      input.focus();
      opdaterForslag("");
    }
  }

  // ---- Søgefelt med forslag (som på songspot.net: skriv, se forslag, klik ét) ----
  // Matcher på BÅDE titel og kunstner — skriver man "medina", kommer hendes
  // sange frem; skriver man en titel som findes hos flere kunstnere, kommer
  // de alle sammen frem så man kan vælge den rigtige.
  // Ved tomt felt vises intet — man skal skrive noget først.
  function findForslag(tekst) {
    const q = normaliser(tekst);
    if (q.length === 0) return [];
    return SANGE.filter(s => normaliser(s.titel).includes(q) || normaliser(s.kunstner).includes(q));
  }

  function opdaterForslag(tekst) {
    const liste = document.getElementById("forslag-liste");
    if (!liste) return;
    const q = normaliser(tekst);
    if (q.length === 0) {
      liste.innerHTML = "";
      return;
    }
    const forslag = findForslag(tekst);
    if (forslag.length === 0) {
      liste.innerHTML = `<p class="ingen-match">Ingen sange matcher.</p>`;
      return;
    }
    liste.innerHTML = forslag
      .map(s => `<button type="button" data-titel="${escapeHtml(s.titel)}" onclick="vaelgForslag(this.dataset.titel)">${escapeHtml(s.titel)} — ${escapeHtml(s.kunstner)}</button>`)
      .join("");
  }

  function vaelgForslag(titel) {
    gaetIndsendt(titel);
  }

  function haandterTast(event) {
    if (event.key !== "Enter") return;
    event.preventDefault();
    const foersteKnap = document.querySelector("#forslag-liste button");
    if (foersteKnap) vaelgForslag(foersteKnap.dataset.titel);
  }

  function renderSlut() {
    document.getElementById("game").innerHTML = `
      <p>Færdig! Du gættede ${state.rigtige} ud af ${SANGE.length} rigtigt.</p>
      <button onclick="nulstil()">Spil igen</button>
    `;
  }

  startSang();
</script>

</body>
</html>
