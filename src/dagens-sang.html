<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ørehænger — dagens sang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #faf7f2;
    color: #2b2b2b;
    line-height: 1.5;
    padding: 32px 16px 60px;
  }
  button { font-family: inherit; }

  .side {
    max-width: 480px;
    margin: 0 auto;
  }

  .topbar { margin-bottom: 20px; }
  .logo {
    font-weight: 700;
    font-size: 1.7em;
    letter-spacing: -0.5px;
    margin: 0;
  }
  .logo::after {
    content: "";
    display: block;
    width: 42px;
    height: 6px;
    background: #d7263d;
    margin-top: 8px;
    border-radius: 3px;
  }
  .undertekst {
    color: #6b6b6b;
    margin: 12px 0 0;
    font-size: 0.95em;
  }

  #lydstyrke-kontrol {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 20px 0;
    font-size: 0.9em;
    color: #6b6b6b;
  }
  #lydstyrke-kontrol input[type="range"] {
    flex: 1;
    max-width: 200px;
    accent-color: #d7263d;
  }

  #spil {
    background: #fff;
    border: 1px solid #ddd6c8;
    border-radius: 16px;
    padding: 24px 20px;
  }

  .dagstal { color: #6b6b6b; font-size: 0.85em; margin: 0 0 6px; }
  .klip-info { color: #2b2b2b; font-size: 0.95em; margin: 0 0 14px; opacity: 0.85; }
  .besked { font-weight: 600; margin: 14px 0 0; }
  .resultat-overskrift { margin: 0 0 14px; }

  .afspil-knap {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #1b1b1b;
    color: #fff;
    font-size: 1.05em;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .afspil-knap:hover { background: #333; }

  .gaet-felt {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ddd6c8;
    background: #fff;
    font-size: 1em;
    font-family: inherit;
    margin-bottom: 8px;
  }
  .gaet-felt:focus {
    outline: none;
    border-color: #d7263d;
  }

  .forslag { display: flex; flex-direction: column; gap: 6px; margin: 0 0 10px; }
  .forslag button.forslag-knap {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #ddd6c8;
    background: #fff;
    font-family: inherit;
    font-size: 0.92em;
    cursor: pointer;
  }
  .forslag button.forslag-knap:hover { border-color: #d7263d; }
  .forslag .ingen-match { opacity: 0.6; margin: 4px 0; font-size: 0.9em; }

  .spring-over {
    background: none;
    border: none;
    color: #6b6b6b;
    text-decoration: underline;
    font-size: 0.9em;
    cursor: pointer;
    padding: 4px 0 0;
  }

  .knap {
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid #ddd6c8;
    background: #fff;
    color: #2b2b2b;
    font-size: 0.95em;
    cursor: pointer;
  }
  .knap:hover { border-color: #d7263d; }

  .fejl { color: #a00; }

  .grid { font-size: 1.4em; letter-spacing: 4px; margin: 4px 0; }

  textarea#del-tekst {
    width: 100%;
    box-sizing: border-box;
    height: 8em;
    font-family: 'Poppins', sans-serif;
    font-size: 0.85em;
    margin: 10px 0;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ddd6c8;
    background: #fdfbf7;
    color: #2b2b2b;
  }

  .sang-recap {
    border-top: 1px solid #eee6d8;
    padding: 10px 0;
    font-size: 0.92em;
  }
  .sang-recap a { color: #d7263d; }

  #kopi-status { font-size: 0.85em; color: #6b6b6b; margin-left: 8px; }

  .tilbage-link { font-size: 0.85em; color: #6b6b6b; margin: 14px 0 0; }
  .tilbage-link a { color: #6b6b6b; }

  /* ---- Computer: mere luft, en løftet kortfølelse, samme opbygning ---- */
  @media (min-width: 700px) {
    body { padding: 64px 24px; }
    .side { max-width: 560px; }
    .logo { font-size: 2.1em; }
    .undertekst { font-size: 1em; }
    #spil {
      padding: 40px 44px;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(43,43,43,0.07);
    }
    .afspil-knap { padding: 16px; font-size: 1.1em; }
    .gaet-felt { padding: 14px 16px; font-size: 1.05em; }
  }
</style>
</head>
<body>

<div class="side">
  <header class="topbar">
    <h1 class="logo">Ørehænger</h1>
    <p class="undertekst">Gæt fem danske sange ud fra klip der vokser. Fem sange, én gang om dagen.</p>
  </header>

  <div id="lydstyrke-kontrol">
    <label for="lydstyrke-slider">🔉 Lydstyrke</label>
    <input type="range" id="lydstyrke-slider" min="0" max="100" value="50">
  </div>

  <div id="spil">Indlæser…</div>

  <audio id="afspiller" style="display:none"></audio>
</div>

<script>
  // ---- Datagrundlag: data/sange.json (genereret automatisk fra
  // data/sange.csv af GitHub Actions — se docs/beslutninger.md).
  // Fyldes af hentSangeData() ved opstart, ikke hardkodet her længere.
  let SANGE = [];

  const KLIP_TRIN = [0.1, 0.5, 2, 8, 15];
  const SANGE_PER_DAG = 5;

  // Dag 1 = den dag fase 1-prototypen blev testet færdig. Ændres ikke —
  // det ville rykke rundt på hvilke sange der er "dagens sange" hvilken dag.
  const EPOKE_DATO = "2026-08-30";

  // Dagens sange skifter kl. 07:00 dansk tid, ikke ved midnat — så nye
  // sange er klar når folk vågner, i stedet for midt om natten (se
  // beslutninger.md, 2026-08-30).
  const SKIFT_KLOKKESLAET_TIMER = 7;

  // ---- "Spildagens" dato i dansk tid, med skift kl. SKIFT_KLOKKESLAET_TIMER
  // i stedet for ved midnat ----
  // Simpelt trick: spørg "hvilken dansk kalenderdag var det for N timer
  // siden" i stedet for "hvilken dansk kalenderdag er det nu". Så bliver
  // kl. 06:59 stadig regnet som i går, og kl. 07:00 skifter til i dag.
  // Virker uden en backend og håndterer selv sommertid, ligesom før — det
  // eneste der er ændret er hvilket klokkeslæt dagen "starter" på.
  function dagensDatoIDanmark() {
    const nu = new Date();
    const forskudtTidspunkt = new Date(nu.getTime() - SKIFT_KLOKKESLAET_TIMER * 60 * 60 * 1000);
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Copenhagen",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).format(forskudtTidspunkt);
  }

  function dageMellem(dato1, dato2) {
    const [y1, m1, d1] = dato1.split("-").map(Number);
    const [y2, m2, d2] = dato2.split("-").map(Number);
    const t1 = Date.UTC(y1, m1 - 1, d1);
    const t2 = Date.UTC(y2, m2 - 1, d2);
    return Math.round((t2 - t1) / 86400000);
  }

  const idagDato = dagensDatoIDanmark();
  const dagNummer = dageMellem(EPOKE_DATO, idagDato) + 1; // dag 1, 2, 3, ...

  // Vælger SANGE_PER_DAG forskellige sange til i dag, ved at gå gennem
  // sangpuljen i rækkefølge og starte et nyt sted hver dag. Med kun ti
  // sange i puljen betyder det puljen går i ring hver 2. dag — det retter
  // sig selv når der kommer flere sange i data/sange.csv.
  function dagensSangListe() {
    const n = SANGE.length;
    const start = ((dagNummer - 1) * SANGE_PER_DAG) % n;
    const valgte = [];
    for (let i = 0; i < Math.min(SANGE_PER_DAG, n); i++) {
      valgte.push(SANGE[(start + i) % n]);
    }
    return valgte;
  }

  const state = {
    dagensSange: [],
    sangIndex: 0,
    trinIndex: 0,
    afsloeret: false,
    nuvaerendeSang: null,
    resultater: [],
  };

  let spilTimeout = null;

  // ---- Lydstyrke (gemmes lokalt, ikke knyttet til en bestemt dag) ----
  const LYDSTYRKE_NOEGLE = "oerehaenger-lydstyrke";

  function hentGemtLydstyrke() {
    try {
      const gemt = localStorage.getItem(LYDSTYRKE_NOEGLE);
      const tal = gemt === null ? 50 : Number(gemt);
      return Number.isFinite(tal) ? Math.min(100, Math.max(0, tal)) : 50;
    } catch (e) {
      return 50;
    }
  }

  function saetLydstyrke(procent) {
    const audio = document.getElementById("afspiller");
    if (audio) audio.volume = procent / 100;
    try {
      localStorage.setItem(LYDSTYRKE_NOEGLE, String(procent));
    } catch (e) {
      console.error("Kunne ikke gemme lydstyrke", e);
    }
  }

  function opsaetLydstyrkeKontrol() {
    try {
      const slider = document.getElementById("lydstyrke-slider");
      if (!slider) return;
      const gemtProcent = hentGemtLydstyrke();
      slider.value = gemtProcent;
      saetLydstyrke(gemtProcent);
      slider.addEventListener("input", () => saetLydstyrke(Number(slider.value)));
    } catch (e) {
      // Lydstyrke-kontrollen må aldrig kunne vælte resten af opstarten.
      console.error("Kunne ikke sætte lydstyrke-kontrol op", e);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function normaliser(s) {
    return String(s)
      .toLowerCase()
      .normalize("NFC")
      .replace(/[^\p{L}\p{N}\s]/gu, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  // ---- Gem/hent dagens samlede resultat lokalt (ikke en cookie, intet login) ----
  function lagerNoegle() {
    return `oerehaenger-dagens-${idagDato}`;
  }

  function hentGemtResultat() {
    try {
      const raw = localStorage.getItem(lagerNoegle());
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      // Et tidligere, forladt format af spillet gemte data i en anden facon
      // under samme nøgle (kun én sang i stedet for et "sange"-array).
      // Sådan gammelt data skal ikke få spillet til at gå ned — smid det væk
      // og start en frisk runde i stedet.
      if (!parsed || !Array.isArray(parsed.sange)) {
        console.error("Gemt resultat har et ukendt format — ignorerer det", parsed);
        localStorage.removeItem(lagerNoegle());
        return null;
      }
      return parsed;
    } catch (e) {
      console.error("Kunne ikke læse gemt resultat", e);
      return null;
    }
  }

  function gemResultat(heltResultat) {
    try {
      localStorage.setItem(lagerNoegle(), JSON.stringify(heltResultat));
    } catch (e) {
      console.error("Kunne ikke gemme resultat lokalt", e);
    }
  }

  // ---- Hent sangdata (én gang, ved opstart — ikke live per sang) ----
  // data/sange.json indeholder allerede lyd-URL, årstal, genre og
  // startpunkt for hver sang, fundet af GitHub-robotten på forhånd. Ingen
  // JSONP nødvendig længere — det er en almindelig lokal fil, hentet med
  // fetch(). Kræver at siden åbnes via en rigtig server (fx GitHub Pages),
  // ikke ved at dobbeltklikke filen direkte.
  async function hentSangeData() {
    const svar = await fetch("../data/sange.json");
    if (!svar.ok) {
      throw new Error(`Kunne ikke hente data/sange.json (status ${svar.status})`);
    }
    const data = await svar.json();
    if (!Array.isArray(data)) {
      throw new Error("data/sange.json har et uventet format (ikke en liste)");
    }
    const gyldige = data.filter(s => s && s.titel && s.kunstner && s.lyd_url);
    if (gyldige.length === 0) {
      throw new Error("data/sange.json er tom eller mangler lyd-links — kør generator-scriptet (se docs/beslutninger.md)");
    }
    return gyldige;
  }

  // Spotify: intet API-kald, bare et søgelink — kræver ingen konto eller
  // nøgler. Se beslutninger.md, 2026-08-30, for hvorfor det ikke er et
  // præcist link.
  function spotifySoegeLink(sang) {
    return `https://open.spotify.com/search/${encodeURIComponent(sang.titel + " " + sang.kunstner)}`;
  }

  // ---- Opstart ----
  async function start() {
    document.getElementById("spil").innerHTML = "<p>Henter dagens sange…</p>";
    SANGE = await hentSangeData();

    const gemt = hentGemtResultat();
    if (gemt) {
      renderAlleredeSpillet(gemt);
      return;
    }
    state.dagensSange = dagensSangListe();
    state.sangIndex = 0;
    state.resultater = [];
    startSang();
  }

  function startSang() {
    state.trinIndex = 0;
    state.afsloeret = false;
    state.nuvaerendeSang = state.dagensSange[state.sangIndex];
    const audio = document.getElementById("afspiller");
    audio.src = state.nuvaerendeSang.lyd_url;
    render();
  }

  function spilKlip() {
    const audio = document.getElementById("afspiller");
    const varighed = KLIP_TRIN[state.trinIndex];
    const startpunkt = (state.nuvaerendeSang.start_offset_ms || 0) / 1000;
    clearTimeout(spilTimeout);
    audio.currentTime = startpunkt;
    audio.play().catch(e => console.error("Kunne ikke afspille", e));
    spilTimeout = setTimeout(() => audio.pause(), varighed * 1000);
  }

  function gaetIndsendt(vaerdi) {
    if (state.afsloeret) return;
    const gaet = normaliser(vaerdi);
    if (gaet.length === 0) return;
    const sang = state.nuvaerendeSang;
    const gyldigeTitler = [sang.titel, ...(sang.alternative_titler || [])].map(normaliser);
    if (gyldigeTitler.includes(gaet)) {
      afslutSang(state.trinIndex);
    } else {
      naesteTrin("forkert");
    }
  }

  function springOver() {
    if (state.afsloeret) return;
    naesteTrin("sprunget-over");
  }

  function naesteTrin(besked) {
    const audio = document.getElementById("afspiller");
    audio.pause();
    if (state.trinIndex < KLIP_TRIN.length - 1) {
      state.trinIndex++;
      render(besked);
    } else {
      afslutSang(null);
    }
  }

  function sangIkkeFundet() {
    registrerResultat(null, 0);
    naesteSang();
  }

  function afslutSang(rigtigtTrinIndex) {
    const audio = document.getElementById("afspiller");
    audio.pause();
    state.afsloeret = true;
    const antalBrugteTrin = rigtigtTrinIndex !== null ? rigtigtTrinIndex + 1 : KLIP_TRIN.length;
    registrerResultat(rigtigtTrinIndex, antalBrugteTrin);
    naesteSang();
  }

  function registrerResultat(rigtigtTrinIndex, antalBrugteTrin) {
    const sang = state.nuvaerendeSang;
    const resultat = {
      titel: sang.titel,
      kunstner: sang.kunstner,
      rigtigtTrin: rigtigtTrinIndex,
      antalBrugteTrin,
      appleLink: sang.link_ud || null,
      spotifyLink: spotifySoegeLink(sang),
    };
    state.resultater.push(resultat);
    return resultat;
  }

  function naesteSang() {
    state.sangIndex++;
    if (state.sangIndex >= state.dagensSange.length) {
      const heltResultat = { dagNummer, sange: state.resultater };
      gemResultat(heltResultat);
      renderSamletResultat(heltResultat);
    } else {
      startSang();
    }
  }

  // ---- Emoji-grid (Wordle/Heardle-stil) ----
  function genererGrid(resultat) {
    let grid = "";
    for (let i = 0; i < KLIP_TRIN.length; i++) {
      if (resultat.rigtigtTrin !== null && i === resultat.rigtigtTrin) grid += "🟩";
      else if (i < resultat.antalBrugteTrin) grid += "🟥";
      else grid += "⬜";
    }
    return grid;
  }

  function genererDelTekst(heltResultat) {
    const antalGaettet = heltResultat.sange.filter(s => s.rigtigtTrin !== null).length;
    const linjer = heltResultat.sange.map(genererGrid).join("\n");
    return `Ørehænger — dagens 5 sange #${heltResultat.dagNummer}\nGættet: ${antalGaettet}/${heltResultat.sange.length} sange\n\n${linjer}`;
  }

  function kopierResultat() {
    const gemt = hentGemtResultat();
    if (!gemt) return;
    const tekst = genererDelTekst(gemt);
    const status = document.getElementById("kopi-status");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tekst)
        .then(() => { if (status) status.textContent = "Kopieret!"; })
        .catch(() => markerTekstTilKopiering(status));
    } else {
      markerTekstTilKopiering(status);
    }
  }

  function markerTekstTilKopiering(status) {
    const felt = document.getElementById("del-tekst");
    if (felt) { felt.focus(); felt.select(); }
    if (status) status.textContent = "Kunne ikke kopiere automatisk — teksten er markeret, tryk Ctrl/Cmd+C.";
  }

  // ---- Rendering ----
  function render(besked) {
    const sang = state.nuvaerendeSang;
    const el = document.getElementById("spil");
    if (!sang) return;

    // Skulle i praksis ikke ske — generatoren tager kun sange med lyd_url
    // med i sange.json — men et sikkerhedsnet er billigt at have.
    if (!sang.lyd_url) {
      el.innerHTML = `
        <p class="dagstal">Sang ${state.sangIndex + 1} af ${state.dagensSange.length}</p>
        <p class="fejl">Mangler et lyd-link for "${escapeHtml(sang.titel)}". Springer videre.</p>
        <button class="knap" onclick="sangIkkeFundet()">Næste sang</button>
      `;
      return;
    }

    const varighed = KLIP_TRIN[state.trinIndex];
    let html = `
      <p class="dagstal">Dagens sange #${dagNummer} — sang ${state.sangIndex + 1} af ${state.dagensSange.length}</p>
      <p class="klip-info">Klip ${state.trinIndex + 1} af ${KLIP_TRIN.length}: ${varighed} sekund${varighed === 1 ? "" : "er"}</p>
      <button class="afspil-knap" onclick="spilKlip()">▶ Afspil klip</button>
    `;

    if (besked === "forkert") html += `<p class="besked">Forkert. Næste klip er længere.</p>`;
    if (besked === "sprunget-over") html += `<p class="besked">Sprunget over. Næste klip er længere.</p>`;

    html += `
      <div>
        <input id="gaet-input" class="gaet-felt" type="text" placeholder="Skriv en sangtitel…" autocomplete="off"
               oninput="opdaterForslag(this.value)" onkeydown="haandterTast(event)">
        <div id="forslag-liste" class="forslag"></div>
        <button class="spring-over" onclick="springOver()">Spring over</button>
      </div>
    `;

    el.innerHTML = html;
    const input = document.getElementById("gaet-input");
    if (input) {
      input.focus();
      opdaterForslag("");
    }
  }

  function renderSamletResultat(heltResultat) {
    const el = document.getElementById("spil");
    const antalGaettet = heltResultat.sange.filter(s => s.rigtigtTrin !== null).length;
    const recap = heltResultat.sange.map(s => `
      <div class="sang-recap">
        <div class="grid">${genererGrid(s)}</div>
        <span>${escapeHtml(s.titel)} — ${escapeHtml(s.kunstner)}</span>
        ${s.appleLink ? ` · <a href="${s.appleLink}" target="_blank" rel="noopener">Apple Music</a>` : ""}
        · <a href="${s.spotifyLink}" target="_blank" rel="noopener">Spotify</a>
      </div>
    `).join("");

    el.innerHTML = `
      <p class="resultat-overskrift"><strong>Dagens 5 sange er klaret: ${antalGaettet} ud af ${heltResultat.sange.length} gættet.</strong></p>
      <textarea id="del-tekst" readonly>${escapeHtml(genererDelTekst(heltResultat))}</textarea>
      <button class="knap" onclick="kopierResultat()">Kopiér resultat</button>
      <span id="kopi-status"></span>
      <p class="besked">Kom tilbage i morgen for fem nye sange.</p>
      <button class="afspil-knap" onclick="startBonusRunde()">🔁 Spil videre</button>
      ${recap}
    `;
  }

  function renderAlleredeSpillet(heltResultat) {
    renderSamletResultat(heltResultat);
    const el = document.getElementById("spil");
    const p = document.createElement("p");
    p.textContent = "Du har allerede spillet dagens 5 sange.";
    el.prepend(p);
  }

  // ---- Søgefelt med forslag (matcher hele sangpuljen, ikke kun dagens 5) ----
  function findForslag(tekst) {
    const q = normaliser(tekst);
    if (q.length === 0) return [];
    return SANGE.filter(s => {
      const felter = [s.titel, s.kunstner, ...(s.alternative_titler || []), ...(s.alternative_kunstnere || [])];
      return felter.some(f => normaliser(f).includes(q));
    });
  }

  function opdaterForslag(tekst) {
    const liste = document.getElementById("forslag-liste");
    if (!liste) return;
    const q = normaliser(tekst);
    if (q.length === 0) {
      liste.innerHTML = "";
      return;
    }
    const forslag = findForslag(tekst);
    if (forslag.length === 0) {
      liste.innerHTML = `<p class="ingen-match">Ingen sange matcher.</p>`;
      return;
    }
    liste.innerHTML = forslag
      .map(s => `<button type="button" class="forslag-knap" data-titel="${escapeHtml(s.titel)}" onclick="vaelgForslag(this.dataset.titel)">${escapeHtml(s.titel)} — ${escapeHtml(s.kunstner)}</button>`)
      .join("");
  }

  function vaelgForslag(titel) {
    gaetIndsendt(titel);
  }

  function haandterTast(event) {
    if (event.key !== "Enter") return;
    event.preventDefault();
    const foersteKnap = document.querySelector("#forslag-liste button");
    if (foersteKnap) vaelgForslag(foersteKnap.dataset.titel);
  }

  // ---- "Spil videre": valgfrie bonusrunder efter dagens 5 ----
  // Adskilt fra dagens-sang-flowet foroven: intet her gemmes i
  // localStorage, tæller ikke med i det delte resultat, og har ikke sit
  // eget emoji-grid (Emil bad om at det bare skal være for sjov). Hvilke
  // sange man allerede har fået i dag (dagens 5 + tidligere bonusrunder)
  // huskes kun i hukommelsen, så en genindlæsning af siden nulstiller
  // bonus-historikken — men aldrig dagens 5, de undgås altid.
  const bonusState = {
    sange: [],
    indexIBatch: 0,
    trinIndex: 0,
    afsloeret: false,
    nuvaerendeSang: null,
  };
  let bonusSpilTimeout = null;
  const bonusHoerteIder = new Set();

  function vaelgBonusSange() {
    let pulje = SANGE.filter(s => !bonusHoerteIder.has(s.id));
    // Puljen løbet tør (eller tæt på) — start forfra, men behold stadig
    // udelukkelsen af dagens 5, så man ikke straks får dem igen.
    if (pulje.length < SANGE_PER_DAG) {
      bonusHoerteIder.clear();
      state.dagensSange.forEach(s => bonusHoerteIder.add(s.id));
      pulje = SANGE.filter(s => !bonusHoerteIder.has(s.id));
    }
    const blandet = [...pulje];
    for (let i = blandet.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [blandet[i], blandet[j]] = [blandet[j], blandet[i]];
    }
    return blandet.slice(0, Math.min(SANGE_PER_DAG, blandet.length));
  }

  function startBonusRunde() {
    if (bonusHoerteIder.size === 0) {
      state.dagensSange.forEach(s => bonusHoerteIder.add(s.id));
    }
    bonusState.sange = vaelgBonusSange();
    bonusState.indexIBatch = 0;
    if (bonusState.sange.length === 0) {
      document.getElementById("spil").innerHTML = `
        <p class="besked">Ikke flere sange i puljen lige nu.</p>
        <p class="tilbage-link"><a href="#" onclick="visDagensResultat(); return false;">← Tilbage til dagens resultat</a></p>
      `;
      return;
    }
    startBonusSang();
  }

  function startBonusSang() {
    bonusState.trinIndex = 0;
    bonusState.afsloeret = false;
    bonusState.nuvaerendeSang = bonusState.sange[bonusState.indexIBatch];
    const audio = document.getElementById("afspiller");
    audio.src = bonusState.nuvaerendeSang.lyd_url;
    renderBonus();
  }

  function spilBonusKlip() {
    const audio = document.getElementById("afspiller");
    const varighed = KLIP_TRIN[bonusState.trinIndex];
    const startpunkt = (bonusState.nuvaerendeSang.start_offset_ms || 0) / 1000;
    clearTimeout(bonusSpilTimeout);
    audio.currentTime = startpunkt;
    audio.play().catch(e => console.error("Kunne ikke afspille", e));
    bonusSpilTimeout = setTimeout(() => audio.pause(), varighed * 1000);
  }

  function gaetBonusIndsendt(vaerdi) {
    if (bonusState.afsloeret) return;
    const gaet = normaliser(vaerdi);
    if (gaet.length === 0) return;
    const sang = bonusState.nuvaerendeSang;
    const gyldigeTitler = [sang.titel, ...(sang.alternative_titler || [])].map(normaliser);
    if (gyldigeTitler.includes(gaet)) {
      afslutBonusSang(true);
    } else {
      naesteBonusTrin("forkert");
    }
  }

  function springBonusOver() {
    if (bonusState.afsloeret) return;
    naesteBonusTrin("sprunget-over");
  }

  function naesteBonusTrin(besked) {
    const audio = document.getElementById("afspiller");
    audio.pause();
    if (bonusState.trinIndex < KLIP_TRIN.length - 1) {
      bonusState.trinIndex++;
      renderBonus(besked);
    } else {
      afslutBonusSang(false);
    }
  }

  function afslutBonusSang(gaettetRigtigt) {
    const audio = document.getElementById("afspiller");
    audio.pause();
    bonusState.afsloeret = true;
    bonusHoerteIder.add(bonusState.nuvaerendeSang.id);
    renderBonusAfsloering(gaettetRigtigt);
  }

  function naesteBonusSang() {
    bonusState.indexIBatch++;
    startBonusSang();
  }

  function visDagensResultat() {
    const gemt = hentGemtResultat();
    if (gemt) renderSamletResultat(gemt);
  }

  function renderBonus(besked) {
    const el = document.getElementById("spil");
    const varighed = KLIP_TRIN[bonusState.trinIndex];
    let html = `
      <p class="dagstal">Spil videre — sang ${bonusState.indexIBatch + 1} af ${bonusState.sange.length}</p>
      <p class="klip-info">Klip ${bonusState.trinIndex + 1} af ${KLIP_TRIN.length}: ${varighed} sekund${varighed === 1 ? "" : "er"}</p>
      <button class="afspil-knap" onclick="spilBonusKlip()">▶ Afspil klip</button>
    `;

    if (besked === "forkert") html += `<p class="besked">Forkert. Næste klip er længere.</p>`;
    if (besked === "sprunget-over") html += `<p class="besked">Sprunget over. Næste klip er længere.</p>`;

    html += `
      <div>
        <input id="bonus-gaet-input" class="gaet-felt" type="text" placeholder="Skriv en sangtitel…" autocomplete="off"
               oninput="opdaterBonusForslag(this.value)" onkeydown="haandterBonusTast(event)">
        <div id="bonus-forslag-liste" class="forslag"></div>
        <button class="spring-over" onclick="springBonusOver()">Spring over</button>
      </div>
      <p class="tilbage-link"><a href="#" onclick="visDagensResultat(); return false;">← Tilbage til dagens resultat</a></p>
    `;

    el.innerHTML = html;
    const input = document.getElementById("bonus-gaet-input");
    if (input) {
      input.focus();
      opdaterBonusForslag("");
    }
  }

  function renderBonusAfsloering(gaettetRigtigt) {
    const sang = bonusState.nuvaerendeSang;
    const el = document.getElementById("spil");
    const erSidsteISvaeret = bonusState.indexIBatch >= bonusState.sange.length - 1;
    const besked = gaettetRigtigt ? "Rigtigt!" : "Ikke gættet.";
    el.innerHTML = `
      <p class="besked">${besked} Det var <strong>${escapeHtml(sang.titel)}</strong> — ${escapeHtml(sang.kunstner)}.</p>
      <button class="knap" onclick="${erSidsteISvaeret ? "startBonusRunde()" : "naesteBonusSang()"}">${erSidsteISvaeret ? "🔁 Spil videre" : "Næste sang"}</button>
      <p class="tilbage-link"><a href="#" onclick="visDagensResultat(); return false;">← Tilbage til dagens resultat</a></p>
    `;
  }

  // ---- Søgeforslag til "spil videre" — samme søgning som ovenfor
  // (findForslag), matcher hele sangpuljen, ikke kun bonusrundens 5 ----
  function opdaterBonusForslag(tekst) {
    const liste = document.getElementById("bonus-forslag-liste");
    if (!liste) return;
    const q = normaliser(tekst);
    if (q.length === 0) {
      liste.innerHTML = "";
      return;
    }
    const forslag = findForslag(tekst);
    if (forslag.length === 0) {
      liste.innerHTML = `<p class="ingen-match">Ingen sange matcher.</p>`;
      return;
    }
    liste.innerHTML = forslag
      .map(s => `<button type="button" class="forslag-knap" data-titel="${escapeHtml(s.titel)}" onclick="vaelgBonusForslag(this.dataset.titel)">${escapeHtml(s.titel)} — ${escapeHtml(s.kunstner)}</button>`)
      .join("");
  }

  function vaelgBonusForslag(titel) {
    gaetBonusIndsendt(titel);
  }

  function haandterBonusTast(event) {
    if (event.key !== "Enter") return;
    event.preventDefault();
    const foersteKnap = document.querySelector("#bonus-forslag-liste button");
    if (foersteKnap) vaelgBonusForslag(foersteKnap.dataset.titel);
  }

  // Sikkerhedsnet: hvis siden af en eller anden grund aldrig kommer i gang
  // (uventet fejl, blokeret netværksopslag der ikke fanges undervejs),
  // skal den ikke hænge fast på "Indlæser…" for evigt uden forklaring.
  function visOpstartsfejl(detalje) {
    document.getElementById("spil").innerHTML = `
      <p class="fejl">Siden kunne ikke starte spillet. Prøv at genindlæse siden.</p>
      <button class="knap" onclick="location.reload()">Genindlæs</button>
      ${detalje ? `<p style="opacity:0.5; font-size:0.85em; margin-top:10px;">Teknisk besked (til fejlsøgning): ${escapeHtml(detalje)}</p>` : ""}
    `;
  }

  let opstartFaerdig = false;
  setTimeout(() => {
    if (!opstartFaerdig) {
      visOpstartsfejl("opstarten kom aldrig i gang (15 sekunders sikkerhedsnet udløst)");
    }
  }, 15000);

  opsaetLydstyrkeKontrol();
  start()
    .then(() => { opstartFaerdig = true; })
    .catch(e => {
      opstartFaerdig = true;
      console.error("Uventet fejl ved opstart", e);
      visOpstartsfejl(String(e && e.message ? e.message : e));
    });
</script>

</body>
</html>
